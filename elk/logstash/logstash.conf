# pipeline.conf
input {
  tcp {
    port => 5000
    mode => "server"
    # Use a text codec instead of json/jsonlines
    codec => line { charset => "UTF-8" }
  }
}

filter {
  # Trim trailing carriage returns (\r) from Windows/HTTP-style lines
  mutate {
    gsub => ["message", "\r$", ""]
  }

  # Split "Key: Value" into fields
  grok {
    match => { "message" => "^%{DATA:header_key}:\s*%{GREEDYDATA:header_value}$" }
    tag_on_failure => []
  }

  # Normalize header keys to lowercase and replace dashes with underscores
  mutate {
    lowercase => ["header_key"]
    gsub => ["header_key", "-", "_"]
  }

  # Special handling examples
  if [header_key] == "accept_language" {
    # Split "en-US,en;q=0.9,..." into an array
    mutate { split => { "header_value" => "," } }
  }

  # Build a structured event from parsed headers
  aggregate {
    task_id => "%{[@metadata][connection_id]}"   # set from input if available
    code => "
      map['headers'] ||= {}
      if event.get('header_key') && event.get('header_value')
        map['headers'][event.get('header_key')] = event.get('header_value')
      end
      event.cancel # buffer until flush
    "
    map_action => "create_or_update"
    timeout => 5
  }
}

output {
  # Flush aggregated headers as a single event (requires an aggregate flush in real pipelines)
  # Or, if you don't aggregate, just output the parsed line-by-line events
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "ingress-headers-%{+YYYY.MM.dd}"
  }
  # stdout { codec => rubydebug } # for local debugging
}
